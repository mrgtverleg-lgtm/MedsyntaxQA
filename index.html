<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medsyntax Framework</title>
  <meta name="robots" content="noindex">
  <!-- Without JavaScript: go to the Framework after 1 second. -->
  <meta http-equiv="refresh" content="1; url=framework/">
  <script>
    // The base address opens the Medsyntax Framework.
    // Old links of the Medsyntax app (?query=… or ?querytitle=…) go to the Medsyntax Editor on medsyntax.org.
    // Everything else, such as a Framework share link (?s=…), goes to framework/ with its ?… and #… kept.
    (function () {
      var p = new URLSearchParams(location.search);
      var target = (p.has('query') || p.has('querytitle'))
        ? 'https://www.medsyntax.org/' + location.search + location.hash
        : 'framework/' + location.search + location.hash;
      location.replace(target);
    })();
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 2rem max(16px, env(safe-area-inset-left, 0px)); color: #1d2b2a; background: #f4f7f6; }
    a { color: #0b6e6a; }
  </style>
</head>
<body>
  <p>Opening the Medsyntax Framework… If nothing happens, <a href="framework/">go to the Medsyntax Framework</a>.</p>
</body>
</html>
