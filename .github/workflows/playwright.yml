# Runs the Playwright tests on every push and pull request.
# A failing test gives the commit or pull request a red cross on GitHub.
name: Playwright tests

on:
  push:
  pull_request:
  # Also allows a manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Chromium and WebKit browsers
        run: npx playwright install --with-deps chromium webkit

      # playwright.config.js starts the local python3 web server itself
      - name: Run the Playwright tests
        run: npx playwright test

      - name: Upload the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
